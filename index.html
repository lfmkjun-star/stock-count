<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f7d6b">
<title>재고실사 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#eaeeec; --surface:#ffffff; --surface-2:#f3f6f4; --surface-3:#eef2f0;
    --ink:#15211d; --muted:#5b6a64; --faint:#8a9691;
    --line:#dbe2df; --line-strong:#c6d0cb;
    --accent:#0f7d6b; --accent-deep:#0b5f52; --accent-soft:#e1f0ec; --accent-ink:#ffffff;
    --danger:#b8463b;
    --shadow:0 1px 2px rgba(18,40,34,.06),0 8px 24px rgba(18,40,34,.06);
    --shadow-sm:0 1px 2px rgba(18,40,34,.07);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0d1310; --surface:#161f1b; --surface-2:#1c2723; --surface-3:#212d28;
      --ink:#e7efec; --muted:#94a39d; --faint:#6c7b75;
      --line:#293430; --line-strong:#374440;
      --accent:#2bb39a; --accent-deep:#5fd6bf; --accent-soft:#12302a; --accent-ink:#04120e;
      --danger:#e0685b;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
      --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1310; --surface:#161f1b; --surface-2:#1c2723; --surface-3:#212d28;
    --ink:#e7efec; --muted:#94a39d; --faint:#6c7b75;
    --line:#293430; --line-strong:#374440;
    --accent:#2bb39a; --accent-deep:#5fd6bf; --accent-soft:#12302a; --accent-ink:#04120e;
    --danger:#e0685b;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
    line-height:1.45; overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px; margin:0 auto; padding:14px 9px calc(24px + env(safe-area-inset-bottom)); min-height:100vh}

  /* ---- header ---- */
  header{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px}
  .brand{display:flex; flex-direction:column; gap:3px}
  .kicker{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:600}
  h1{margin:0; font-size:22px; font-weight:700; letter-spacing:-.01em}
  .sub{font-size:12.5px; color:var(--muted); margin-top:1px}
  .hbtns{display:flex; gap:8px; flex:none}
  .theme-btn{
    flex:none; width:40px; height:40px; border-radius:11px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-size:16px; cursor:pointer; box-shadow:var(--shadow-sm);
  }
  .theme-btn:active{transform:translateY(1px)}
  .lockbtn.unlocked{border-color:var(--accent); background:var(--accent-soft)}

  /* ---- formula note ---- */
  .formula{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:var(--surface-2); border:1px solid var(--line); border-radius:12px;
    padding:9px 12px; font-size:12px; color:var(--muted); margin-bottom:16px;
  }
  .formula code{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px;
    color:var(--ink); background:var(--surface); border:1px solid var(--line);
    padding:3px 7px; border-radius:6px; white-space:normal; line-height:1.6;
  }

  /* ---- desktop table header (hidden on mobile) ---- */
  .thead{display:none}

  /* ---- product card ---- */
  .list{display:flex; flex-direction:column; gap:12px}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:15px;
    padding:12px 11px 13px; box-shadow:var(--shadow);
  }
  .card-top{display:flex; align-items:center; gap:8px; margin-bottom:11px}
  .idx{
    flex:none; width:26px; height:26px; border-radius:8px; background:var(--surface-3);
    color:var(--faint); font-size:12px; font-weight:600; display:grid; place-items:center;
    font-family:"IBM Plex Mono",monospace;
  }
  .name-field{flex:1; min-width:0}
  .name-field label,.f label{
    display:block; font-size:11.5px; letter-spacing:0; text-transform:none;
    color:var(--muted); font-weight:600; margin-bottom:4px;
  }
  .tag{font-size:9.5px; color:var(--accent); border:1px solid var(--accent-soft); background:var(--accent-soft);
    padding:1px 5px; border-radius:5px; margin-left:5px; letter-spacing:.03em; vertical-align:1px}
  input[type=text]{
    width:100%; border:none; border-bottom:1.5px solid var(--line-strong); background:transparent;
    color:var(--ink); font:600 16px/1.3 "IBM Plex Sans KR",sans-serif; padding:2px 0 4px;
  }
  input[type=text]:focus{outline:none; border-bottom-color:var(--accent)}
  input[type=text]::placeholder{color:var(--faint); font-weight:400}

  .del{
    flex:none; width:32px; height:32px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface); color:var(--danger); font-size:15px; cursor:pointer; line-height:1;
  }
  .del:active{transform:translateY(1px)}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:9px}
  .f{position:relative}
  .f.wide{grid-column:1 / -1}
  .num{
    width:100%; border:1.5px solid var(--line-strong); border-radius:11px; background:var(--surface-2);
    color:var(--ink); font:600 17px/1.2 "IBM Plex Mono",monospace; padding:10px 34px 10px 11px;
    text-align:right; -moz-appearance:textfield;
  }
  .num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .num:focus{outline:none; border-color:var(--accent); background:var(--surface); box-shadow:0 0 0 3px var(--accent-soft)}
  .unit{position:absolute; right:11px; bottom:11px; font-size:12px; color:var(--faint); pointer-events:none;
    font-family:"IBM Plex Sans KR",sans-serif; font-weight:500}

  /* primary input emphasis (b,c) */
  .f.primary label{color:var(--accent-deep)}
  .f.primary .num{border-color:var(--accent); background:var(--surface)}

  /* fixed field (d) */
  .f.fixed .num{background:var(--surface-3); border-style:dashed; color:var(--muted)}

  /* result row (e) */
  .result{
    grid-column:1 / -1; margin-top:2px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--accent-soft); border:1px solid transparent; border-radius:12px; padding:10px 14px;
  }
  .result .rlabel{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-deep); font-weight:600}
  .result .rval{
    font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:24px; color:var(--accent-deep);
    font-variant-numeric:tabular-nums; letter-spacing:-.01em;
  }
  .result .rval b{font-weight:600}
  .result .rval span{font-size:13px; font-weight:500; margin-left:3px; opacity:.75}

  /* ---- add ---- */
  .add{
    width:100%; margin-top:14px; padding:13px; border:1.5px dashed var(--line-strong); border-radius:14px;
    background:transparent; color:var(--muted); font:600 14px "IBM Plex Sans KR",sans-serif; cursor:pointer;
  }
  .add:hover{border-color:var(--accent); color:var(--accent)}
  .add:active{transform:translateY(1px)}
  .export{
    width:100%; margin-top:9px; padding:12px; border:1px solid var(--line); border-radius:14px;
    background:var(--surface); color:var(--ink); font:600 14px "IBM Plex Sans KR",sans-serif; cursor:pointer;
    box-shadow:var(--shadow-sm); display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .export span{color:var(--accent); font-size:15px}
  .export:hover{border-color:var(--accent)}
  .export:active{transform:translateY(1px)}
  .resetbtn{font-size:19px; line-height:1}
  .resetbtn.armed{border-color:var(--danger); background:var(--danger); color:#fff}

  /* ---- toast ---- */
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(10px);
    background:var(--ink); color:var(--bg); font-size:13px; font-weight:500;
    padding:10px 16px; border-radius:10px; box-shadow:var(--shadow); opacity:0; pointer-events:none;
    transition:opacity .2s,transform .2s; z-index:40; max-width:88vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  /* ---- wide screens: real table ---- */
  @media (min-width:640px){
    .thead{
      display:grid; grid-template-columns:32px 1.4fr 1fr 1fr .7fr 1.1fr; gap:10px; align-items:end;
      padding:0 14px 8px; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase;
      color:var(--faint); font-weight:600;
    }
    .thead .r{text-align:right}
    .card{display:grid; grid-template-columns:32px 1.4fr 1fr 1fr .7fr 1.1fr; gap:10px; align-items:center; padding:12px 14px}
    .card-top{margin:0; display:contents}
    .idx{grid-column:1}
    .name-field{grid-column:2}
    .name-field label{display:none}
    .grid{display:contents}
    .f label{display:none}
    .f.b{grid-column:3} .f.c{grid-column:4} .f.d{grid-column:5}
    .result{grid-column:6; margin:0; background:transparent; padding:0; justify-content:flex-end}
    .result .rlabel{display:none}
    .result .rval{font-size:19px}
    .del{position:absolute; right:8px; top:8px; width:26px; height:26px; font-size:13px}
    .card{position:relative}
  }
  /* ---- locked (실사) mode: a,b read-only; hide add/delete ---- */
  input[readonly]{cursor:default; border-bottom-color:transparent}
  input[readonly]:focus{border-bottom-color:transparent}
  .num[readonly]{cursor:default; background:var(--surface-3); border-style:dashed; color:var(--muted); box-shadow:none}
  .num[readonly]:focus{border-color:var(--line-strong); box-shadow:none; background:var(--surface-3)}
  .lock-note{
    display:none; align-items:center; gap:7px; font-size:12px; color:var(--muted);
    background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-bottom:12px;
  }
  html.is-locked .lock-note{display:flex}
  html.is-locked .del{display:none}
  html.is-locked #addBtn{display:none}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="brand">
      <div class="kicker">재고실사 · Stock Count</div>
      <h1>제품 무게 실사 계산기</h1>
      <div class="sub">사용중무게 · 개수를 입력하면 합계(kg)가 자동 계산됩니다.</div>
    </div>
    <div class="hbtns">
      <button class="theme-btn resetbtn" id="resetBtn" title="사용중무게·개수 초기화" aria-label="사용중무게·개수 초기화">↺</button>
      <button class="theme-btn lockbtn" id="lockBtn" title="설정 잠금/해제" aria-label="설정 잠금/해제">🔒</button>
      <button class="theme-btn" id="themeBtn" title="테마 전환" aria-label="테마 전환">◑</button>
    </div>
  </header>

  <div class="formula">
    계산식
    <code>합계(kg) = ( 미사용무게 × 개수 + 사용중무게 ) ÷ 1000</code>
  </div>

  <div class="lock-note" id="lockNote">🔒 실사 모드 — 제품명·미사용무게는 잠겨 있습니다. 세팅하려면 🔓 를 누르세요.</div>

  <div class="thead" aria-hidden="true">
    <div>#</div>
    <div>제품명</div>
    <div class="r">미사용g</div>
    <div class="r">사용중g</div>
    <div class="r">개수</div>
    <div class="r">합계 kg</div>
  </div>

  <div class="list" id="list"></div>

  <button class="add" id="addBtn">+ 제품 추가</button>
  <button class="export" id="exportBtn"><span>⬇</span> CSV 내보내기</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  var KEY="jaego_silsa_v3";
  var list=document.getElementById("list");

  function load(){
    try{ var r=localStorage.getItem(KEY); if(r){var d=JSON.parse(r); if(Array.isArray(d)&&d.length) return d;} }catch(e){}
    return [
      {a:"생강",b:"20000",c:"",d:""},
      {a:"표고",b:"10000",c:"",d:""},
      {a:"다시마",b:"10000",c:"",d:""},
      {a:"캐슈넛",b:"12000",c:"",d:""},
      {a:"맛소금",b:"20000",c:"",d:""},
      {a:"후추",b:"10000",c:"",d:""},
      {a:"꽃게",b:"20000",c:"",d:""},
      {a:"멸치",b:"20000",c:"",d:""},
      {a:"새우",b:"20000",c:"",d:""},
      {a:"설탕",b:"15000",c:"",d:""},
      {a:"미원",b:"25000",c:"",d:""},
      {a:"다시다",b:"20000",c:"",d:""},
      {a:"베트남",b:"20000",c:"",d:""},
      {a:"정탑",b:"20000",c:"",d:""},
      {a:"다농",b:"20000",c:"",d:""}
    ];
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(rows)); }catch(e){}
  }
  var rows=load();

  var locked=true;
  try{ if(localStorage.getItem(KEY+"_lock")==="0") locked=false; }catch(e){}
  var lockBtn=document.getElementById("lockBtn");
  function applyLock(){
    document.documentElement.classList.toggle("is-locked",locked);
    lockBtn.textContent = locked ? "🔒" : "🔓";
    lockBtn.classList.toggle("unlocked",!locked);
    list.querySelectorAll('[data-k="a"],[data-k="b"]').forEach(function(inp){
      if(locked) inp.setAttribute("readonly","readonly"); else inp.removeAttribute("readonly");
    });
  }

  function num(v){ var n=parseFloat(v); return isFinite(n)?n:0; }
  // e = (b * d + c) / 1000  → kg
  function calc(r){ return (num(r.b)*num(r.d)+num(r.c))/1000; }

  function render(){
    list.innerHTML="";
    rows.forEach(function(r,i){
      var card=document.createElement("div");
      card.className="card";
      card.innerHTML=
        '<div class="card-top">'+
          '<div class="idx">'+(i+1)+'</div>'+
          '<div class="name-field"><label>제품명</label>'+
            '<input type="text" data-k="a" placeholder="제품명 입력" value=""></div>'+
          '<button class="del" title="삭제" aria-label="삭제">✕</button>'+
        '</div>'+
        '<div class="grid">'+
          '<div class="f b fixed"><label>미사용무게(고정)</label>'+
            '<input class="num" data-k="b" inputmode="decimal" placeholder="0"><span class="unit">g</span></div>'+
          '<div class="f c primary"><label>사용중무게</label>'+
            '<input class="num" data-k="c" inputmode="decimal" placeholder="0"><span class="unit">g</span></div>'+
          '<div class="f d primary"><label>개수</label>'+
            '<input class="num" data-k="d" inputmode="decimal" placeholder="0"><span class="unit">개</span></div>'+
          '<div class="result"><span class="rlabel">합계</span>'+
            '<span class="rval"><b class="eout">0.00</b><span>kg</span></span></div>'+
        '</div>';

      // set values (avoid HTML injection via value attr)
      card.querySelector('[data-k="a"]').value=r.a||"";
      card.querySelector('[data-k="b"]').value=r.b||"";
      card.querySelector('[data-k="c"]').value=r.c||"";
      card.querySelector('[data-k="d"]').value=r.d||"";
      card.querySelector(".eout").textContent=calc(r).toFixed(2);

      card.querySelectorAll("input").forEach(function(inp){
        inp.addEventListener("input",function(){
          rows[i][inp.getAttribute("data-k")]=inp.value;
          card.querySelector(".eout").textContent=calc(rows[i]).toFixed(2);
          save();
        });
      });
      card.querySelector(".del").addEventListener("click",function(){
        rows.splice(i,1);
        if(!rows.length) rows.push({a:"",b:"",c:"",d:""});
        save(); render();
      });
      list.appendChild(card);
    });
    applyLock();
  }

  document.getElementById("addBtn").addEventListener("click",function(){
    rows.push({a:"",b:"",c:"",d:""}); save(); render();
    var cards=list.querySelectorAll(".card");
    var last=cards[cards.length-1];
    if(last){ last.querySelector('[data-k="a"]').focus(); last.scrollIntoView({block:"center",behavior:"smooth"}); }
  });

  // ---- toast ----
  var toastEl=document.getElementById("toast"), toastT;
  function toast(msg){
    toastEl.textContent=msg; toastEl.classList.add("show");
    clearTimeout(toastT); toastT=setTimeout(function(){toastEl.classList.remove("show");},2400);
  }

  // ---- CSV export ----
  function csvCell(v){ return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'; }
  function dateStamp(){
    var d=new Date(), p=function(n){return (n<10?"0":"")+n;};
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
  }
  function buildCSV(){
    var out=[];
    out.push(["제품명","합계무게(kg)"].map(csvCell).join(","));
    rows.forEach(function(r){
      out.push([r.a||"", calc(r).toFixed(2)].map(csvCell).join(","));
    });
    return "﻿"+out.join("\r\n"); // BOM for Excel Korean
  }
  document.getElementById("exportBtn").addEventListener("click",function(){
    var csv=buildCSV(), fn="재고실사_"+dateStamp()+".csv";
    (async function(){
      var dl=null;
      try{ if(window.claude&&claude.use) dl=await claude.use("downloads"); }catch(e){}
      if(dl){
        try{ await dl.save({filename:fn, data:csv}); toast("CSV 저장 완료"); }
        catch(err){
          if(err&&err.code==="declined") return;
          toast("저장 실패 — 다시 시도해 주세요");
        }
        return;
      }
      // fallback: owner/local environment (viewer sandbox blocks this)
      try{
        var blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
        var url=URL.createObjectURL(blob);
        var a=document.createElement("a"); a.href=url; a.download=fn;
        document.body.appendChild(a); a.click();
        setTimeout(function(){URL.revokeObjectURL(url); a.remove();},120);
        toast("CSV 내보냄");
      }catch(e){ toast("이 화면에선 저장이 지원되지 않습니다"); }
    })();
  });

  // ---- reset (사용중무게·개수만 초기화, 2-tap 확인) ----
  var resetBtn=document.getElementById("resetBtn"), resetArmed=false, resetT;
  function disarmReset(){ resetArmed=false; resetBtn.classList.remove("armed"); clearTimeout(resetT); }
  resetBtn.addEventListener("click",function(){
    if(!resetArmed){
      resetArmed=true; resetBtn.classList.add("armed");
      toast("↺ 를 한 번 더 눌러 사용중무게·개수 초기화");
      resetT=setTimeout(disarmReset,3000);
      return;
    }
    disarmReset();
    rows.forEach(function(r){ r.c=""; r.d=""; });
    save(); render();
    toast("사용중무게·개수를 초기화했습니다");
  });

  lockBtn.addEventListener("click",function(){
    locked=!locked;
    try{ localStorage.setItem(KEY+"_lock", locked?"1":"0"); }catch(e){}
    applyLock();
  });

  // theme toggle
  var tb=document.getElementById("themeBtn");
  try{ var t=localStorage.getItem(KEY+"_theme"); if(t) document.documentElement.setAttribute("data-theme",t); }catch(e){}
  tb.addEventListener("click",function(){
    var cur=document.documentElement.getAttribute("data-theme");
    var next = cur==="dark" ? "light" : cur==="light" ? "dark" :
      (window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches ? "light":"dark");
    document.documentElement.setAttribute("data-theme",next);
    try{ localStorage.setItem(KEY+"_theme",next); }catch(e){}
  });

  render();
})();
</script>

</body>
</html>
